[project]
name = "afad-earthquake-mcp"
version = "0.1.0"
description = "MCP server for recent earthquakes in Türkiye from the AFAD API"
authors = [
    { name = "Kam", email = "erkamyaman35@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
]

[project.scripts]
afad-earthquake-mcp = "afad_earthquake_mcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

